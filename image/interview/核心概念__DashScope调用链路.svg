<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">DashScope（通义）调用链路（示意）</text>
  <text class="muted" x="40" y="86">重点：把“业务逻辑”与“模型调用”隔离，便于测试、治理与替换模型。</text>

  <rect class="box" x="70" y="150" width="260" height="110"/>
  <text class="text" x="100" y="190">Controller</text>
  <text class="muted" x="100" y="218">接收用户请求</text>

  <rect class="accent" x="350" y="150" width="260" height="110"/>
  <text class="text" x="380" y="190">AI Facade</text>
  <text class="muted" x="380" y="218">组装 Prompt/Tools</text>

  <rect class="box" x="630" y="150" width="260" height="110"/>
  <text class="text" x="660" y="190">DashScope</text>
  <text class="muted" x="660" y="218">Qwen Chat/Embeddings</text>

  <rect class="box" x="350" y="310" width="540" height="140"/>
  <text class="text" x="380" y="350">治理与可观测性</text>
  <text class="muted" x="380" y="378">超时、重试、限流、缓存、审计日志、指标</text>
  <text class="muted" x="380" y="406">错误分层：401/403、429、5xx、解析失败</text>

  <path class="arrow" d="M 330 205 L 350 205"/>
  <path class="arrow" d="M 610 205 L 630 205"/>
  <path class="arrow" d="M 480 260 L 480 310"/>
</svg>
