<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .pill { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 999; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">可观测性：从一次 AI 调用到全链路定位</text>
  <text class="muted" x="40" y="86">建议最少落地：日志 + 指标。规模起来后再上追踪与告警。</text>

  <rect class="box" x="70" y="150" width="820" height="120"/>
  <text class="text" x="100" y="192">一次 AI 调用</text>
  <text class="muted" x="100" y="220">requestId、provider/model、耗时、重试次数、token（可选）、失败原因（脱敏）</text>

  <rect class="pill" x="110" y="330" width="220" height="40"/>
  <text class="muted" x="190" y="355">日志（Log）</text>

  <rect class="pill" x="370" y="330" width="220" height="40"/>
  <text class="muted" x="440" y="355">指标（Metrics）</text>

  <rect class="pill" x="630" y="330" width="220" height="40"/>
  <text class="muted" x="710" y="355">追踪（Trace）</text>

  <rect class="box" x="70" y="400" width="820" height="90"/>
  <text class="text" x="100" y="440">告警与治理</text>
  <text class="muted" x="100" y="466">429/5xx 激增、P95 延迟上升、成本异常 → 限流/降级/切换模型</text>

  <path class="arrow" d="M 480 270 L 480 330"/>
  <path class="arrow" d="M 480 370 L 480 400"/>
</svg>
