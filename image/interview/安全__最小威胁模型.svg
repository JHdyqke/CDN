<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .risk { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 14; }
      .safe { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">AI 应用最小威胁模型（示意）</text>
  <text class="muted" x="40" y="86">把风险按“入口 → 执行 → 数据”分层，逐层设防。</text>

  <rect class="risk" x="70" y="150" width="250" height="120"/>
  <text class="text" x="100" y="195">Prompt 注入</text>
  <text class="muted" x="100" y="223">诱导绕过规则</text>

  <rect class="risk" x="355" y="150" width="250" height="120"/>
  <text class="text" x="385" y="195">越权工具调用</text>
  <text class="muted" x="385" y="223">不该查/不该改</text>

  <rect class="risk" x="640" y="150" width="250" height="120"/>
  <text class="text" x="670" y="195">数据泄露</text>
  <text class="muted" x="670" y="223">PII/密钥/内部文档</text>

  <rect class="safe" x="70" y="330" width="820" height="130"/>
  <text class="text" x="100" y="372">安全基线</text>
  <text class="muted" x="100" y="400">工具白名单 + 参数校验 + 鉴权 + 审计 + 超时/限流 + 输出脱敏</text>
  <text class="muted" x="100" y="428">密钥只走环境变量/密钥服务；日志不落敏感原文</text>

  <path class="arrow" d="M 195 270 L 195 330"/>
  <path class="arrow" d="M 480 270 L 480 330"/>
  <path class="arrow" d="M 765 270 L 765 330"/>
</svg>
