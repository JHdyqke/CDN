<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
      .tag { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">Spring Boot + Spring AI：自动配置与多环境管理</text>
  <text class="muted" x="40" y="86">依赖 + 配置文件 → 自动装配 ChatClient/ImageClient → 业务注入使用</text>

  <rect class="box" x="70" y="140" width="260" height="140"/>
  <text class="text" x="100" y="182">Starter 依赖</text>
  <text class="muted" x="100" y="210">spring-ai-*-spring-boot-starter</text>
  <rect class="tag" x="100" y="230" width="200" height="28"/>
  <text class="muted" x="112" y="250">Maven/Gradle</text>

  <rect class="box" x="350" y="140" width="260" height="140"/>
  <text class="text" x="380" y="182">application-*.yml</text>
  <text class="muted" x="380" y="210">api-key / base-url / model</text>
  <rect class="tag" x="380" y="230" width="190" height="28"/>
  <text class="muted" x="392" y="250">profiles: dev/prod</text>

  <rect class="box" x="630" y="140" width="260" height="140"/>
  <text class="text" x="660" y="182">自动配置 Bean</text>
  <text class="muted" x="660" y="210">ChatClient / ImageClient</text>
  <rect class="tag" x="660" y="230" width="200" height="28"/>
  <text class="muted" x="672" y="250">可覆盖：@Bean 自定义</text>

  <rect class="box" x="70" y="330" width="820" height="150"/>
  <text class="text" x="100" y="372">业务层使用</text>
  <text class="muted" x="100" y="400">Controller/Service 直接注入 ChatClient，并通过属性切换模型与供应商</text>
  <rect class="tag" x="100" y="420" width="240" height="28"/>
  <text class="muted" x="112" y="440">安全：密钥走环境变量/密钥管理</text>

  <path class="arrow" d="M 330 210 L 350 210"/>
  <path class="arrow" d="M 610 210 L 630 210"/>
  <path class="arrow" d="M 760 280 L 760 330"/>
</svg>
