<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .warn { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">排障思路：先定位“哪一层出问题”（示意）</text>
  <text class="muted" x="40" y="86">从网络/鉴权 → 限流 → 解析 → 业务，按层排除。</text>

  <rect class="warn" x="70" y="150" width="820" height="110"/>
  <text class="text" x="100" y="195">1) 连接与鉴权</text>
  <text class="muted" x="100" y="223">401/403、DNS、代理、证书、Key 是否为空</text>

  <rect class="warn" x="70" y="280" width="820" height="110"/>
  <text class="text" x="100" y="325">2) 限流与重试</text>
  <text class="muted" x="100" y="353">429、重试雪崩、并发过高、缺少退避</text>

  <rect class="warn" x="70" y="410" width="820" height="90"/>
  <text class="text" x="100" y="450">3) 输出解析与业务</text>
  <text class="muted" x="100" y="475">JSON 解析失败、工具参数非法、越权被拒绝</text>

  <path class="arrow" d="M 480 260 L 480 280"/>
  <path class="arrow" d="M 480 390 L 480 410"/>
</svg>
