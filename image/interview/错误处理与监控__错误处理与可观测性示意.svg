<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
      .pill { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 999; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">错误处理与可观测性：从异常到指标/追踪/告警</text>
  <text class="muted" x="40" y="86">建议把“可恢复错误”和“不可恢复错误”分层，配合重试、熔断、降级与审计日志。</text>

  <rect class="box" x="70" y="140" width="250" height="120"/>
  <text class="text" x="100" y="180">AI 调用失败</text>
  <text class="muted" x="100" y="206">超时 / 429 / 5xx / 解析失败</text>

  <rect class="box" x="355" y="140" width="250" height="120"/>
  <text class="text" x="385" y="180">策略层</text>
  <text class="muted" x="385" y="206">重试 / 超时 / 限流 / 兜底</text>

  <rect class="box" x="640" y="140" width="250" height="120"/>
  <text class="text" x="670" y="180">返回给用户</text>
  <text class="muted" x="670" y="206">明确提示 + 可恢复建议</text>

  <rect class="box" x="70" y="310" width="820" height="160"/>
  <text class="text" x="100" y="350">可观测性（Observability）</text>

  <rect class="pill" x="110" y="380" width="200" height="34"/>
  <text class="muted" x="150" y="402">日志（Log）</text>

  <rect class="pill" x="350" y="380" width="200" height="34"/>
  <text class="muted" x="385" y="402">指标（Metrics）</text>

  <rect class="pill" x="590" y="380" width="200" height="34"/>
  <text class="muted" x="630" y="402">追踪（Trace）</text>

  <text class="muted" x="110" y="440">建议记录：provider/model、token、耗时、重试次数、失败原因（脱敏）</text>

  <path class="arrow" d="M 320 200 L 355 200"/>
  <path class="arrow" d="M 605 200 L 640 200"/>
  <path class="arrow" d="M 480 260 L 480 310"/>
</svg>
