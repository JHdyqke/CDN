<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">学习资源地图（从入门到上线）</text>
  <text class="muted" x="40" y="86">按“做项目”的路径选资源：文档 → 示例 → 工程化 → 可观测与治理。</text>

  <rect class="accent" x="70" y="130" width="820" height="90"/>
  <text class="text" x="100" y="175">官方文档</text>
  <text class="muted" x="100" y="202">Spring AI Reference、Spring Boot Docs、Reactor Docs</text>

  <rect class="box" x="70" y="250" width="390" height="120"/>
  <text class="text" x="100" y="292">示例与模板</text>
  <text class="muted" x="100" y="320">官方 samples、社区示例、你自己的“最小可复用脚手架”</text>
  <text class="muted" x="100" y="346">建议：沉淀一个可复制的 starter 项目</text>

  <rect class="box" x="500" y="250" width="390" height="120"/>
  <text class="text" x="530" y="292">工程化与上线</text>
  <text class="muted" x="530" y="320">配置管理、密钥管理、灰度、回滚</text>
  <text class="muted" x="530" y="346">可观测性、限流、缓存、成本治理</text>

  <rect class="box" x="70" y="400" width="820" height="100"/>
  <text class="text" x="100" y="442">社区与更新</text>
  <text class="muted" x="100" y="468">关注版本变更、API 迁移指南，及时更新依赖与示例代码</text>

  <path class="arrow" d="M 480 220 L 480 250"/>
  <path class="arrow" d="M 265 370 L 265 400"/>
  <path class="arrow" d="M 695 370 L 695 400"/>
</svg>
