<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">实战项目：知识库助手（RAG + Tools + SSE）架构（示意）</text>
  <text class="muted" x="40" y="86">把“检索”“工具”“对话”拆开，避免把业务逻辑塞进 Controller。</text>

  <rect class="box" x="70" y="150" width="260" height="120"/>
  <text class="text" x="100" y="195">Web API</text>
  <text class="muted" x="100" y="223">/rag/ask /stream/ask</text>

  <rect class="accent" x="350" y="150" width="260" height="120"/>
  <text class="text" x="380" y="195">RAG Service</text>
  <text class="muted" x="380" y="223">检索 + Prompt 组装</text>

  <rect class="box" x="630" y="150" width="260" height="120"/>
  <text class="text" x="660" y="195">ChatClient</text>
  <text class="muted" x="660" y="223">DashScope/Qwen</text>

  <rect class="box" x="70" y="330" width="260" height="120"/>
  <text class="text" x="100" y="375">VectorStore</text>
  <text class="muted" x="100" y="403">文档向量库</text>

  <rect class="box" x="350" y="330" width="260" height="120"/>
  <text class="text" x="380" y="375">Tools</text>
  <text class="muted" x="380" y="403">FAQ/工单/检索</text>

  <rect class="box" x="630" y="330" width="260" height="120"/>
  <text class="text" x="660" y="375">治理层</text>
  <text class="muted" x="660" y="403">限流/监控/审计</text>

  <path class="arrow" d="M 330 210 L 350 210"/>
  <path class="arrow" d="M 610 210 L 630 210"/>
  <path class="arrow" d="M 220 270 L 220 330"/>
  <path class="arrow" d="M 480 270 L 480 330"/>
  <path class="arrow" d="M 760 270 L 760 330"/>
</svg>
