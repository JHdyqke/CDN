<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
      .accent { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">实战：图像生成服务（异步任务 + 存储 + 回调）</text>
  <text class="muted" x="40" y="86">关键：生成通常更慢更贵，建议走异步与可重试任务。</text>

  <rect class="box" x="70" y="140" width="250" height="110"/>
  <text class="text" x="100" y="180">客户端</text>
  <text class="muted" x="100" y="206">提交 prompt，查询任务状态</text>

  <rect class="accent" x="355" y="140" width="250" height="110"/>
  <text class="text" x="385" y="180">Image API（Spring Boot）</text>
  <text class="muted" x="385" y="206">鉴权、限流、任务队列</text>

  <rect class="box" x="640" y="140" width="250" height="110"/>
  <text class="text" x="670" y="180">图像模型</text>
  <text class="muted" x="670" y="206">DALL·E / Qwen-VL 等</text>

  <rect class="box" x="70" y="290" width="820" height="170"/>
  <text class="text" x="100" y="330">存储与分发</text>
  <text class="muted" x="100" y="358">对象存储（S3/OSS/MinIO）+ CDN</text>
  <text class="muted" x="100" y="386">任务表：PENDING/RUNNING/SUCCEEDED/FAILED</text>
  <text class="muted" x="100" y="414">回调：Webhook 或轮询</text>

  <path class="arrow" d="M 320 195 L 355 195"/>
  <path class="arrow" d="M 605 195 L 640 195"/>
  <path class="arrow" d="M 480 250 L 480 290"/>
</svg>
