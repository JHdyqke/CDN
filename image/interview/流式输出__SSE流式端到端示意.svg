<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box { fill: #f7f9fc; stroke: #1f2a44; stroke-width: 2; rx: 14; }
      .accent { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .arrow { stroke: #1f2a44; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="40" y="54">流式输出（SSE）端到端示意</text>
  <text class="muted" x="40" y="86">模型 token 流 → WebFlux Flux → SSE → 浏览器逐段渲染。</text>

  <rect class="box" x="90" y="170" width="220" height="110"/>
  <text class="text" x="120" y="215">ChatClient.stream()</text>
  <text class="muted" x="120" y="243">返回 Flux</text>

  <rect class="box" x="340" y="170" width="220" height="110"/>
  <text class="text" x="370" y="215">映射 token/chunk</text>
  <text class="muted" x="370" y="243">map/merge</text>

  <rect class="box" x="590" y="170" width="220" height="110"/>
  <text class="text" x="620" y="215">SSE 序列化</text>
  <text class="muted" x="620" y="243">ServerSentEvent</text>

  <rect class="accent" x="340" y="330" width="470" height="120"/>
  <text class="text" x="370" y="372">浏览器 EventSource</text>
  <text class="muted" x="370" y="400">onmessage 追加到页面</text>

  <path class="arrow" d="M 310 225 L 340 225"/>
  <path class="arrow" d="M 560 225 L 590 225"/>
  <path class="arrow" d="M 700 280 L 700 330"/>
</svg>
