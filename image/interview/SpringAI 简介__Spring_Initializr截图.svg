<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #0b1324; opacity: 0.04; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; rx: 16; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .text { font: 16px Arial, Helvetica, sans-serif; fill: #0b1324; }
      .muted { font: 14px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .chip { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 999; }
      .btn { fill: #16a34a; rx: 12; }
      .btnText { font: 700 16px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .field { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <rect class="panel" x="0" y="0" width="960" height="540"/>

  <rect class="card" x="70" y="60" width="820" height="420"/>
  <text class="title" x="110" y="110">Spring Initializr（示意图）</text>
  <text class="muted" x="110" y="140">用于说明在 start.spring.io 上选择的关键参数（非真实截图）。</text>

  <rect class="field" x="110" y="175" width="360" height="44"/>
  <text class="muted" x="130" y="203">Project</text>
  <text class="text" x="250" y="203">Maven</text>

  <rect class="field" x="510" y="175" width="340" height="44"/>
  <text class="muted" x="530" y="203">Spring Boot</text>
  <text class="text" x="660" y="203">3.2.x</text>

  <rect class="field" x="110" y="235" width="360" height="44"/>
  <text class="muted" x="130" y="263">Language</text>
  <text class="text" x="250" y="263">Java</text>

  <rect class="field" x="510" y="235" width="340" height="44"/>
  <text class="muted" x="530" y="263">Java</text>
  <text class="text" x="660" y="263">17</text>

  <text class="muted" x="110" y="315">Dependencies</text>
  <rect class="chip" x="110" y="330" width="130" height="34"/>
  <text class="muted" x="140" y="352">Spring Web</text>
  <rect class="chip" x="255" y="330" width="160" height="34"/>
  <text class="muted" x="280" y="352">Spring AI</text>

  <rect class="btn" x="720" y="395" width="130" height="46"/>
  <text class="btnText" x="748" y="424">Generate</text>
</svg>
